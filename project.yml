name: TimeConverter
# NOTE: every Info.plist in this repo is GENERATED by xcodegen from this file.
# Do NOT edit them directly — changes will be overwritten on next
# `xcodegen generate`. Edit the info.properties sections below instead.
#
# The .xcodeproj is not tracked in git — regenerate it any time with
# `xcodegen generate` (scripts do this automatically).
#
# Shape of this project (backlog item 16, the native two-target restructure):
#
#   TimeConverterCore   local SPM package — parsing, presenter, launch logic,
#                       the bundled gazetteer, and ALL the unit tests that go
#                       with them. Consumed by every target below.
#   TimeConverter       the iOS/iPadOS app (SwiftUI), + TimeConverterControls
#                       embedded in it.
#   TimeConverterMac    the native macOS menu-bar app (SwiftUI + AppKit).
#                       Same bundle id as the iOS app, different platform:
#                       that is what makes it a universal purchase against
#                       the one App Store record (6825044484).
#
# Mac Catalyst is retired. There is no SUPPORTS_MACCATALYST anywhere in here
# any more, and no `[sdk=macosx*]` conditionals on the iOS targets — the Mac
# has its own target with its own unconditional settings.
options:
  bundleIdPrefix: dev.thisolivier
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  # Local-path SPM dependency, the `oym_core` pattern from
  # ../musicLibrary/iOSnative/NaviAdmin. In-repo rather than a sibling
  # directory, because this package has exactly one consumer repo and
  # versioning it separately would buy nothing.
  TimeConverterCore:
    path: TimeConverterCore
# Project-level, so the app, the Controls extension and the Mac app always
# carry the *same* version — the App Store rejects a bundle whose extension
# disagrees with it, and macOS additionally requires CFBundleVersion to
# increase monotonically across *all* platform trains — and so the ship
# scripts have exactly one line to bump.
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "22"
targets:
  TimeConverter:
    type: application
    platform: iOS
    sources:
      # Module readme.md files are docs, not app resources — and because the
      # glob flattens copied resources, two readme.md files in different
      # modules would collide in the bundle without this exclude.
      - path: TimeConverter
        excludes:
          - "**/readme.md"
    dependencies:
      # Everything below the view layer. `import TimeConverterCore` in
      # ContentView, PromptChipRow and ConvertATimeIntent.
      - package: TimeConverterCore
        product: TimeConverterCore
      # The shared design layer (backlog item 20, phase A): the poster and
      # glass colour tokens, the typography helpers, the arrow shapes and
      # `ConversionPairView`. Same package, second product — the iPhone links
      # it for the tokens it already used before they moved out of
      # TimeConverter/Poster, the iPad will link it for the pair view.
      - package: TimeConverterCore
        product: TimeConverterUI
      # Embeds the Control Center extension into the app bundle
      # (TimeConverter.app/PlugIns). An extension is only ever installed as part
      # of its host app, so this line is what puts the control on the device.
      - target: TimeConverterControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thisolivier.timeconverter
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "TimeConverter"
        # Ad-hoc signing, no team: works headlessly with no keychain access.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        # iPhone (1) and iPad (2). Family 6 (Mac) is gone with Catalyst; the
        # Mac is TimeConverterMac now.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Single-size 1024px icon; Xcode derives every size App Store
        # validation demands (90023 rejects uploads with no icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release (archive/TestFlight) only — Debug keeps the ad-hoc, no-team
        # settings above so local dev and `scripts/test.sh` stay headless.
        #
        # Automatic signing (base config, above) cannot resolve an archive
        # identity here: team CNHB9B5GX6 has no Apple Development certificate,
        # only the Apple Distribution one. So the archive step signs manually,
        # straight to the App Store distribution profile. Mirrors NaviAdmin.
        #
        # These stay scoped to the app target: passing provisioning settings
        # command-line-wide leaks them into dependency targets — including the
        # SPM package's — which reject them.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TimeConverter App Store"
          DEVELOPMENT_TEAM: CNHB9B5GX6
    info:
      path: TimeConverter/Info.plist
      properties:
        CFBundleDisplayName: "TimeConverter"
        # $(VAR) placeholders keep MARKETING_VERSION/CURRENT_PROJECT_VERSION in
        # this file as the single source of truth — without them xcodegen bakes
        # a frozen literal into the generated Info.plist on first creation and
        # never updates it again.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Siri matches an App Shortcut phrase against the app's display name —
        # "TimeConverter", one word, which nobody says out loud. These are the
        # spoken synonyms, including the App Store name ("Time Converter 3000"),
        # so "Convert a time in Time Converter" is heard too.
        INAlternativeAppNames:
          - INAlternativeAppName: "Time Converter"
          - INAlternativeAppName: "Time Converter 3000"
        # A private scheme behind the launchers (backlog item 11):
        # `timeconverter://convert` opens the app with an empty, focused field.
        # It exists so the launcher behaviour can be QA'd headlessly — Control
        # Center and Siri cannot be scripted, `xcrun simctl openurl` can — and
        # as a fallback route for the same request. Not a public integration
        # point; see `LaunchURLRouter`.
        CFBundleURLTypes:
          - CFBundleURLName: dev.thisolivier.timeconverter.launch
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - timeconverter
        ITSAppUsesNonExemptEncryption: false
        # All four orientations: App Store validation (90474) rejects bundles
        # with none declared, and iPad multitasking requires the full set.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # The project's first second target (backlog item 11, slice 2): a widget
  # extension whose only content is the Control Center button. It exists because
  # a `ControlWidget` cannot live in an app target — the system loads controls
  # out of an extension.
  #
  # iOS-only, and staying that way: there is no Control Center on the Mac, so
  # the Mac app does not embed it and no Mac provisioning profile is needed for
  # it.
  TimeConverterControls:
    type: app-extension
    platform: iOS
    sources:
      - path: TimeConverterControls
        excludes:
          - "**/readme.md"
      # Shared with the app, deliberately. The extension needs the intent type
      # to resolve the control button's action; the app needs the same type to
      # run `perform()` once it is foregrounded. Compiling it into only one of
      # the two is the classic "the control does nothing when tapped" bug.
      - TimeConverter/Launchers/ConvertATimeIntent.swift
    dependencies:
      # `LaunchRequestInbox` moved into the package with the rest of the
      # launch logic, and the intent posts to it — so the extension links the
      # package too. Harmless duplication: it is a static library, and the
      # extension never touches the gazetteer.
      - package: TimeConverterCore
        product: TimeConverterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thisolivier.timeconverter.controls
        PRODUCT_NAME: "TimeConverterControls"
        SWIFT_VERSION: "6.0"
        # Matches the app: ad-hoc, no team, so Debug builds, scripts/test.sh and
        # scripts/run-ios.sh stay headless with no keychain access.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        # An extension ships *inside* its host app and is never installed on its
        # own, so it must stay out of the archive's Applications directory.
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Release only, exactly as the app target does it — and with the same
        # consequence: this profile must exist before `scripts/ship.sh` can
        # archive. An extension needs its OWN App ID
        # (dev.thisolivier.timeconverter.controls) and its own distribution
        # profile; the app's profile cannot cover it. See the README's shipping
        # note for the portal steps.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TimeConverter Controls App Store"
          DEVELOPMENT_TEAM: CNHB9B5GX6
    info:
      # Generated from here, like the app's — do not edit the plist directly.
      path: TimeConverterControls/Info.plist
      properties:
        CFBundleDisplayName: "TimeConverter Controls"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The one line that makes this a WidgetKit extension rather than a
        # generic app extension. Controls have no principal class: the `@main`
        # `ControlWidget` is the entry point.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The native macOS app (backlog item 16) — a menu-bar utility, not a window
  # app: `MenuBarExtra(.window)` for the dropdown, a summoned floating panel
  # for ⌃⌥T, no Dock icon, no persistent window.
  #
  # It carries the **same bundle id** as the iOS app on purpose. A bundle id is
  # scoped per platform in App Store Connect, so `dev.thisolivier.timeconverter`
  # on macOS is the macOS train of app record 6825044484 rather than a second
  # app — which is what makes it a universal purchase. xcodegen has no opinion
  # about two targets sharing one PRODUCT_BUNDLE_IDENTIFIER (it is just a build
  # setting), and the two products never collide on disk because they build
  # into per-platform directories.
  TimeConverterMac:
    type: application
    platform: macOS
    sources:
      - path: TimeConverterMac
        excludes:
          - "**/readme.md"
          # Signed via CODE_SIGN_ENTITLEMENTS in the Release config, not copied
          # into the bundle as a resource.
          - "*.entitlements"
      # The icon is shared with the iOS app rather than duplicated: one
      # 1024px source, two platform entries in the asset catalog.
      - TimeConverter/Assets.xcassets
    dependencies:
      - package: TimeConverterCore
        product: TimeConverterCore
      # Linked from phase A onwards even though the Mac UI is untouched this
      # phase: the glass panel of phase B is built entirely out of this
      # product, and having the link in place now means the Mac lane compiles
      # the shared views on every test run rather than discovering them broken
      # at the start of B.
      - package: TimeConverterCore
        product: TimeConverterUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thisolivier.timeconverter
        PRODUCT_NAME: "TimeConverter"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Matches the other targets: ad-hoc, no team, so Debug builds,
        # scripts/test.sh and scripts/run-mac.sh stay headless.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
      configs:
        # The Mac App Store lane (scripts/ship-mac.sh). Unconditional now —
        # the `[sdk=macosx*]` conditions the Catalyst lane needed existed only
        # because one target served two platforms.
        #
        # A provisioning profile is platform-scoped: the iOS
        # "TimeConverter App Store" profile reports platforms "visionOS,
        # watchOS, and iOS" and xcodebuild refuses it outright for platform
        # macOS. Hence a second, macOS profile against the SAME App ID — same
        # bundle id, no `maccatalyst.` prefix (that prefix belonged to
        # Catalyst and is gone with it).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TimeConverter Mac App Store"
          DEVELOPMENT_TEAM: CNHB9B5GX6
          # The Mac App Store requires App Sandbox (ITMS-90296 enumerates every
          # executable missing it). Release only, so Debug, scripts/test.sh and
          # scripts/run-mac.sh stay unsandboxed and headless.
          CODE_SIGN_ENTITLEMENTS: TimeConverterMac/TimeConverter-macOS.entitlements
    info:
      path: TimeConverterMac/Info.plist
      properties:
        CFBundleDisplayName: "TimeConverter"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The line that makes this a menu-bar app: no Dock icon, no app menu
        # bar, no window on launch. `TimeConverterMacDelegate` also sets
        # `.accessory` at runtime, belt and braces.
        LSUIElement: true
        # Mandatory for Mac App Store submission (ITMS-90242).
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false

  # The Mac shell's own unit tests — successor to MenuBarPlugInTests, which
  # retired with the Catalyst bundle.
  #
  # Deliberately a **standalone logic bundle with no host application**: the
  # files under test are members of this target as well as of the app (the same
  # trick ConvertATimeIntent uses on iOS). A host-application test bundle would
  # launch the real menu-bar app for every test run, putting a status item in
  # the menu bar and grabbing ⌃⌥T for the duration.
  TimeConverterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TimeConverterMacTests
      - TimeConverterMac/GlobalHotKey.swift
      - TimeConverterMac/SummonPolicy.swift
      # Phase B. The glass panel's two decisions that are not drawing: which
      # container is being filled (and therefore how wide, whose glass, and
      # whether it explains how to dismiss itself), and which section a display
      # state routes to. Both are view-free by construction so that they can be
      # members of a host-less test bundle like the two files above.
      - TimeConverterMac/GlassPanelLayout.swift
      - TimeConverterMac/MacAppearanceOverride.swift
    dependencies:
      # Phase B adds the first Mac-shell logic with opinions about *values* from
      # the package — `ConverterDisplayState` on one side, `GlassPanelMetrics`
      # on the other — so the test bundle has to link them. Still no host
      # application: these are libraries, and linking a library does not launch
      # a menu-bar app the way a test host would.
      - package: TimeConverterCore
        product: TimeConverterCore
      - package: TimeConverterCore
        product: TimeConverterUI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"

  # The iOS shell's own unit tests. Thin by design: everything that is not view
  # code moved into TimeConverterCore, whose test target both schemes run.
  TimeConverterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TimeConverterTests
    dependencies:
      - target: TimeConverter
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  # The iOS lane. `scripts/test.sh --platform ios` runs this, and it is
  # unchanged in spirit: one `xcodebuild test`, every test in the repo that is
  # relevant to iOS. The package's test targets are listed explicitly because a
  # local SPM package's tests are not implied by depending on its libraries.
  TimeConverter:
    build:
      targets:
        TimeConverter: all
        TimeConverterTests: [test]
    test:
      targets:
        - TimeConverterTests
        - package: TimeConverterCore/TimeConverterCoreTests
        - package: TimeConverterCore/TimeConverterUITests
  # The Mac lane. `scripts/test.sh --platform mac` runs this: the same core
  # tests natively on macOS, plus the Mac shell's own, plus — because testing
  # builds the scheme — proof that TimeConverterMac still compiles.
  TimeConverterMac:
    build:
      targets:
        TimeConverterMac: all
        TimeConverterMacTests: [test]
    test:
      targets:
        - TimeConverterMacTests
        - package: TimeConverterCore/TimeConverterCoreTests
        - package: TimeConverterCore/TimeConverterUITests
