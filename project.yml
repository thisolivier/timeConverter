name: TimeConverter
# NOTE: TimeConverter/Info.plist is GENERATED by xcodegen from this file.
# Do NOT edit Info.plist directly — changes will be overwritten on next
# `xcodegen generate`. Edit the info.properties section below instead.
#
# The .xcodeproj is not tracked in git — regenerate it any time with
# `xcodegen generate` (scripts do this automatically).
options:
  bundleIdPrefix: dev.thisolivier
  deploymentTarget:
    iOS: "26.0"
    # Only the TimeConverterMenuBar bundle is a macOS-SDK target (item 12a);
    # the app itself reaches the Mac through Catalyst, i.e. the iOS target.
    macOS: "26.0"
# Project-level, so the app and the TimeConverterControls extension always carry
# the *same* version — the App Store rejects a bundle whose extension disagrees
# with it — and so `scripts/ship.sh` has exactly one line to bump.
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  TimeConverter:
    type: application
    platform: iOS
    sources:
      # Module readme.md files are docs, not app resources — and because the
      # glob flattens copied resources, two readme.md files in different
      # modules would collide in the bundle without this exclude.
      - path: TimeConverter
        excludes:
          - "**/readme.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thisolivier.timeconverter
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "TimeConverter"
        # Ad-hoc signing, no team: works headlessly with no keychain access.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        # Universal app via Mac Catalyst: one iOS target covering
        # iPhone (1), iPad (2), and Mac (6).
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        # Single-size 1024px icon; Xcode derives every size App Store
        # validation demands (90023 rejects uploads with no icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release (archive/TestFlight) only — Debug keeps the ad-hoc, no-team
        # settings above so local dev and `scripts/test.sh` stay headless.
        #
        # Automatic signing (base config, above) cannot resolve an archive
        # identity here: team CNHB9B5GX6 has no Apple Development certificate,
        # only the Apple Distribution one. So the archive step signs manually,
        # straight to the App Store distribution profile. Mirrors NaviAdmin.
        #
        # These stay scoped to the app target: passing provisioning settings
        # command-line-wide leaks them into dependency targets, which reject
        # them.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TimeConverter App Store"
          DEVELOPMENT_TEAM: CNHB9B5GX6
          # --- macOS (Mac Catalyst) train, backlog item 12b ---------------
          # A Mac Catalyst build compiles against the macOS SDK, so
          # `[sdk=macosx*]` is the one condition that separates the Catalyst
          # archive (scripts/ship-mac.sh) from the iOS archive
          # (scripts/ship.sh) while both read this single Release block.
          # Conditional assignments outrank the unconditional ones above, so
          # the iOS lane is byte-for-byte unchanged.
          #
          # A provisioning profile is platform-scoped: the existing
          # "TimeConverter App Store" profile reports platforms
          # "visionOS, watchOS, and iOS" and xcodebuild refuses it outright for
          # platform "macOS". Hence a second, macOS profile against the same
          # App ID — same bundle id, no `maccatalyst.` prefix.
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: "TimeConverter Mac App Store"
          # The Mac App Store requires App Sandbox. Scoped to Release+macOS so
          # Debug, scripts/test.sh and scripts/run-mac.sh stay unsandboxed and
          # headless exactly as before.
          CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: TimeConverter/TimeConverter-macOS.entitlements
    dependencies:
      # Embeds the Control Center extension into the app bundle
      # (TimeConverter.app/PlugIns). An extension is only ever installed as part
      # of its host app, so this line is what puts the control on the device.
      - target: TimeConverterControls
      # The Mac menu-bar bundle (item 12a). Every line here is load-bearing;
      # see the target below and docs/menu-bar-poc-plan.md §2.
      #
      # - platformFilter: macOS -> `platformFilter = maccatalyst` on both the
      #   dependency and the embed build file, so an iOS build (simulator,
      #   device, and the Release archive scripts/ship.sh makes) skips the
      #   bundle entirely. The .ipa is structurally identical to one built
      #   without any of this: no PlugIns entry, no macOS binary, nothing.
      # - embed: true is REQUIRED — `copy:` is ignored without it.
      # - link: false — this is dlopen-ed at runtime, never linked. Linking a
      #   macOS binary into a Catalyst app would fail outright.
      # - copy.destination: plugins -> Contents/PlugIns, which is the one
      #   place `Bundle.main.builtInPlugInsURL` looks. With no `copy:` the
      #   bundle silently lands in Contents/Resources and is never found.
      #   No `subpath`: PLUGINS_FOLDER_PATH already ends in Contents/PlugIns.
      - target: TimeConverterMenuBar
        platformFilter: macOS
        embed: true
        link: false
        codeSign: true
        copy:
          destination: plugins
    info:
      path: TimeConverter/Info.plist
      properties:
        CFBundleDisplayName: "TimeConverter"
        # $(VAR) placeholders keep MARKETING_VERSION/CURRENT_PROJECT_VERSION in
        # this file as the single source of truth — without them xcodegen bakes
        # a frozen literal into the generated Info.plist on first creation and
        # never updates it again.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Siri matches an App Shortcut phrase against the app's display name —
        # "TimeConverter", one word, which nobody says out loud. These are the
        # spoken synonyms, including the App Store name ("Time Converter 3000"),
        # so "Convert a time in Time Converter" is heard too.
        INAlternativeAppNames:
          - INAlternativeAppName: "Time Converter"
          - INAlternativeAppName: "Time Converter 3000"
        # A private scheme behind the launchers (backlog item 11):
        # `timeconverter://convert` opens the app with an empty, focused field.
        # It exists so the launcher behaviour can be QA'd headlessly — Control
        # Center and Siri cannot be scripted, `xcrun simctl openurl` can — and
        # as a fallback route for the same request. Not a public integration
        # point; see `LaunchURLRouter`.
        CFBundleURLTypes:
          - CFBundleURLName: dev.thisolivier.timeconverter.launch
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - timeconverter
        ITSAppUsesNonExemptEncryption: false
        # All four orientations: App Store validation (90474) rejects bundles
        # with none declared, and iPad multitasking requires the full set.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # The project's first second target (backlog item 11, slice 2): a widget
  # extension whose only content is the Control Center button. It exists because
  # a `ControlWidget` cannot live in an app target — the system loads controls
  # out of an extension.
  TimeConverterControls:
    type: app-extension
    platform: iOS
    sources:
      - path: TimeConverterControls
        excludes:
          - "**/readme.md"
      # Shared with the app, deliberately. The extension needs the intent type
      # to resolve the control button's action; the app needs the same type to
      # run `perform()` once it is foregrounded. Compiling it into only one of
      # the two is the classic "the control does nothing when tapped" bug.
      - TimeConverter/Launchers/ConvertATimeIntent.swift
      - TimeConverter/Launchers/LaunchRequest.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thisolivier.timeconverter.controls
        PRODUCT_NAME: "TimeConverterControls"
        SWIFT_VERSION: "6.0"
        # Matches the app: ad-hoc, no team, so Debug builds, scripts/test.sh and
        # scripts/run-ios.sh stay headless with no keychain access.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        # An extension ships *inside* its host app and is never installed on its
        # own, so it must stay out of the archive's Applications directory.
        SKIP_INSTALL: "YES"
        # Repeated from the app target: the Mac Catalyst build embeds this
        # extension, so it has to be buildable for Catalyst or the whole Mac
        # lane fails. `ControlWidgetButton` is available on Mac Catalyst.
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
      configs:
        # Release only, exactly as the app target does it — and with the same
        # consequence: this profile must exist before `scripts/ship.sh` can
        # archive. An extension needs its OWN App ID
        # (dev.thisolivier.timeconverter.controls) and its own distribution
        # profile; the app's profile cannot cover it. See the README's shipping
        # note for the portal steps.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TimeConverter Controls App Store"
          DEVELOPMENT_TEAM: CNHB9B5GX6
          # macOS (Mac Catalyst) train — same reasoning as the app target, and
          # the same cost: the extension's *own* App ID needs its own macOS
          # profile too. The Catalyst archive fails on this target first (it
          # builds before the app), so this is the error Olivier sees if only
          # one of the two macOS profiles has been created.
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: "TimeConverter Controls Mac App Store"
          # An .appex is a separate process with its own signature, so it needs
          # its own App Sandbox entitlement — the host's does not reach it.
          CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: TimeConverterControls/TimeConverterControls-macOS.entitlements
    info:
      # Generated from here, like the app's — do not edit the plist directly.
      path: TimeConverterControls/Info.plist
      properties:
        CFBundleDisplayName: "TimeConverter Controls"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The one line that makes this a WidgetKit extension rather than a
        # generic app extension. Controls have no principal class: the `@main`
        # `ControlWidget` is the entry point.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The Mac menu-bar presence (backlog item 12a) — a loadable *macOS-SDK*
  # bundle, not an app extension. It exists because neither AppKit's
  # NSStatusItem nor Carbon's RegisterEventHotKey is reachable from Mac
  # Catalyst: Carbon.framework is absent from the SDK's iOSSupport tree and
  # importing it under -target …-macabi fails at compile time. A macOS-platform
  # binary loaded into the Catalyst process is what makes those calls legal.
  #
  # Local-only by design. Apple DTS has twice called this architecture
  # unsupported for distribution, and there is no Mac delivery lane yet
  # (backlog item 12b), so nothing here is expected to reach a user. It is also
  # unreachable from iOS by construction — see the dependency comment above.
  TimeConverterMenuBar:
    type: bundle
    platform: macOS
    sources:
      - path: TimeConverterMenuBar
        excludes:
          - "**/readme.md"
      # Shared with the app, deliberately, exactly as the Controls extension
      # shares the intent: both sides need the same @objc protocol, and the
      # runtime cast across the bundle boundary is what connects them.
      - TimeConverter/MenuBar/MenuBarHosting.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thisolivier.timeconverter.menubar
        PRODUCT_NAME: "TimeConverterMenuBar"
        SWIFT_VERSION: "6.0"
        # `.bundle`, not `.framework` or `.appex`: a traditional loadable
        # plug-in, found by name under Contents/PlugIns.
        WRAPPER_EXTENSION: bundle
        # Never installed on its own; it ships (if ever) inside its host.
        SKIP_INSTALL: "YES"
        # Matches the app and the extension: ad-hoc, no team, so Debug builds,
        # scripts/test.sh and scripts/run-mac.sh stay headless.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
      configs:
        # This is the config the Catalyst archive (scripts/ship-mac.sh, item
        # 12b) actually uses — `platformFilter: macOS` includes this target in
        # a Mac Catalyst build and excludes it from the iOS one, so these
        # settings are live on the Mac lane and never evaluated by
        # scripts/ship.sh.
        #
        # Deliberately NO provisioning profile and NO entitlements, and that is
        # a rule rather than a preference: entitlements belong to a *main
        # executable*, and this is a loadable plug-in that runs inside the
        # app's process and inherits the app's sandbox. Giving it its own
        # app-sandbox entitlement or embedded profile is what trips ITMS-90283
        # ("Invalid 'com.apple.application-identifier' entitlement value") on a
        # secondary bundle. Signing with the team's own identity satisfies
        # library validation, so com.apple.security.cs.disable-library-validation
        # is not needed either. See docs/menu-bar-poc-plan.md §3 and the
        # module readme.
        #
        # Consequently there is NO entry for this bundle in
        # ExportOptions-mac.plist: that dictionary keys on main executables
        # (app + .appex), and a plug-in with no profile has nothing to map.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: ""
          DEVELOPMENT_TEAM: CNHB9B5GX6
    info:
      # Generated from here, like the app's — do not edit the plist directly.
      path: TimeConverterMenuBar/Info.plist
      properties:
        CFBundleDisplayName: "TimeConverter Menu Bar"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # BNDL + NSPrincipalClass is the whole loading contract: the app asks
        # the bundle for its principal class and casts it to MenuBarHosting.
        # The name must match the @objc(MenuBarController) runtime name, not
        # the Swift-mangled one.
        CFBundlePackageType: BNDL
        NSPrincipalClass: MenuBarController

  TimeConverterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TimeConverterTests
    dependencies:
      - target: TimeConverter
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        # Catalyst support must be repeated on the test target or the Mac
        # test lane cannot build it.
        SUPPORTS_MACCATALYST: "YES"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
schemes:
  TimeConverter:
    build:
      targets:
        TimeConverter: all
        TimeConverterTests: [test]
    test:
      targets:
        - TimeConverterTests
